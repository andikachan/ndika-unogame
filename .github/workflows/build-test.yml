name: Build & Test Enterprise UNO Engine

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Gradle Build, Static Analysis & Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Code with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: 2. Setup Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Run Static Code Analysis (Detekt)
        run: gradle detekt --info

      - name: 5. Run Unit & Integration Test Suites
        env:
          UPSTASH_REDIS_HOST: localhost
          UPSTASH_REDIS_PORT: 6379
          JWT_SECRET: dGhpc2lzYXZlcnlzZWN1cmVqd3RzZWNyZXRrZXlmb3J1bm9lbmdpbmUyMDI2MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
        run: gradle test --info

      - name: 6. Assemble Executable Boot JAR
        run: gradle bootJar -x test

      - name: 7. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uno-engine-release-jar
          path: build/libs/*.jar
          retention-days: 14
